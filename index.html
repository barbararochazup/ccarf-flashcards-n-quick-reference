<script>
const D=[
{n:"Agentic Architecture",p:"27%",c:[
["Agentic Loop","Fluxo de controle em que Claude recebe uma entrada, decide uma ação (geralmente uma chamada de ferramenta), observa o resultado e continua até concluir a tarefa. O loop roda até o modelo retornar stop_reason end_turn em vez de tool_use.","Perguntas testam se você entende as condições de término do loop e como os valores de stop_reason determinam se ele continua ou sai.","1.1 Agentic Loops"],
["stop_reason","Campo da resposta da API que indica por que o modelo parou de gerar. Os dois valores-chave da prova são end_turn (o modelo terminou naturalmente) e tool_use (o modelo quer chamar uma ferramenta). Em um loop agêntico, tool_use significa continuar; end_turn significa tarefa concluída. Um loop de produção também deve tratar pause_turn, max_tokens, stop_sequence, refusal e model_context_window_exceeded.","Conceito muito cobrado. Baseie as respostas em end_turn vs tool_use e saiba o que cada valor sinaliza para a camada de orquestração.","1.1 Agentic Loops"],
["tool_use","Valor de stop_reason indicando que Claude quer invocar uma ferramenta. A resposta contém um bloco de conteúdo tool_use com o nome da ferramenta e os parâmetros de entrada. O orquestrador deve executar a ferramenta e devolver o resultado como mensagem tool_result antes da próxima chamada à API.","Entenda o fluxo completo: Claude retorna tool_use, o orquestrador executa e envia tool_result. Saiba o que acontece se o resultado da ferramenta for malformado ou estiver ausente.","1.1 Agentic Loops"],
["end_turn","Valor de stop_reason indicando que Claude terminou a resposta e não precisa chamar mais ferramentas. Em um loop agêntico, é o sinal para sair do loop e devolver a resposta final ao usuário.","A prova pode apresentar cenários em que você decide entre continuar o loop ou terminar. end_turn é sempre o sinal de término.","1.1 Agentic Loops"],
["Orchestration Pattern","Abordagem de design para coordenar uma ou mais chamadas a Claude. Os padrões nomeados no guia são: prompt chaining (etapas sequenciais fixas), decomposição adaptativa dinâmica (o modelo decide a divisão em tempo de execução) e hub-and-spoke (um coordenador delega a subagentes e toda comunicação passa por ele). A execução paralela de subtarefas independentes é o outro padrão comum.","Você deve associar cada padrão ao caso de uso correto. Saiba quando prompt chaining é preferível a um único prompt monolítico e quando o paralelismo traz benefício real.","1.2 Multi-Agent Orchestration"],
["Multi-Agent System","Arquitetura em que vários agentes especializados colaboram em uma tarefa. Cada agente tem seu próprio system prompt, ferramentas e responsabilidades. A topologia testada é hub-and-spoke: um coordenador delega a subagentes e toda comunicação entre agentes passa por ele. Subagentes nunca se comunicam diretamente; opções com comunicação peer-to-peer são respostas erradas, pois quebram observabilidade, tratamento de erros consistente e fluxo controlado de informação.","Conheça os trade-offs entre designs de agente único e multiagente. A prova testa quando um sistema multiagente se justifica versus quando um padrão mais simples basta.","1.2 Multi-Agent Orchestration"],
["Coordinator","Agente central em um sistema hub-and-spoke. Decompõe a tarefa, cria e sequencia subagentes e agrega os resultados. É o único componente com visão do trabalho todo, e toda mensagem entre subagentes passa por ele.","Cenários costumam falhar porque o coordenador faz o trabalho especialista ou porque subagentes conversam entre si. Ambos são respostas erradas: o coordenador delega e agrega, e é o único hub de comunicação.","1.2 Multi-Agent Orchestration"],
["Subagent","Instância separada de Claude criada por um coordenador para cuidar de uma parte delimitada do trabalho. Roda em sua própria janela de contexto, com seu próprio system prompt e lista de ferramentas, e devolve um resultado ao coordenador ao terminar.","A propriedade mais cobrada é o isolamento: um subagente não enxerga a conversa do coordenador. Tudo de que precisa deve ser passado explicitamente na definição da tarefa.","1.3 Subagent Invocation and Context Passing"],
["Task Tool (Agent)","Ferramenta que o coordenador chama para delegar trabalho a um subagente. O guia da prova a chama de Task. Estado atual (verificado em 6 de outubro de 2026): o Claude Code a chama de Agent, nome adotado na v2.1.63, e ainda aceita Task como alias. Os dois nomes se referem ao mesmo mecanismo de delegação.","Responda com o nome Task do guia nas questões da prova. Reconheça Agent se o vir na documentação ou nas ferramentas.","1.3 Subagent Invocation and Context Passing"],
["AgentDefinition","Declaração de um subagente: sua descrição, suas instruções e o campo tools, que delimita quais ferramentas ele pode usar. Atenção: o campo de instrução se chama prompt, não systemPrompt (erro comum).","Conheça os nomes dos campos e saiba que tools delimita o acesso. Restrinja cada agente a um conjunto pequeno e focado no papel. A ilustração do guia contrasta 4–5 ferramentas com 18; com 18, a confiabilidade da seleção cai só pela complexidade da decisão. Estado atual (6 de outubro de 2026): a documentação de tool search da Anthropic situa isso em 30–50 ferramentas; na prova, responda com os números do guia.","1.3 Subagent Invocation and Context Passing"],
["allowedTools","Lista de ferramentas que um agente pode chamar. Para um coordenador, essa lista controla a própria delegação: a menos que allowedTools inclua «Task» (ou «Agent», nome desde o Claude Code v2.1.63), o coordenador não consegue criar subagentes, não importa como o prompt esteja escrito.","Modo de falha muito testado: um coordenador que «não delega» geralmente tem allowedTools sem a ferramenta de delegação, e não um problema de prompt.","1.3 Subagent Invocation and Context Passing"],
["fork_session","Opção que ramifica uma sessão para que um agente explore um caminho alternativo sem alterar o contexto original. Exposta como fork_session / forkSession no SDK e --fork-session na CLI. É definida junto com resume: resume nomeia a sessão, fork_session ramifica a partir dela em vez de acrescentar.","É a resposta quando o cenário pede exploração divergente (testar várias abordagens) mantendo a sessão principal intacta.","1.7 Session State and Resumption"],
["Programmatic Enforcement","Impor uma regra de fluxo de trabalho em código (hook, gate ou verificação) em vez de por instrução no system prompt. A orientação por prompt é probabilística e tem taxa de falha acima de zero. A imposição programática é determinística.","Regra de decisão repetida na prova: se uma única falha significa perda financeira, violação de segurança ou de conformidade, a resposta é imposição programática. Prompts mais fortes e few-shot (pares entrada-saída no prompt) são sempre respostas erradas nesses cenários.","1.4 Workflow Enforcement and Handoff"],
["Prerequisite Gate","Verificação em código que bloqueia a execução de uma ferramenta até que uma condição anterior seja satisfeita. Exemplo: recusar process_refund até que get_customer tenha retornado um ID de cliente verificado na sessão atual.","Correção canônica para o cenário «o prompt manda verificar, mas pula 8% das vezes». O gate reduz a taxa de falha a zero porque o modelo não consegue contorná-lo.","1.4 Workflow Enforcement and Handoff"],
["Structured Handoff","Resumo autocontido que um agente monta ao escalar para um humano que não tem a transcrição da conversa. Deve conter ID do cliente, resumo factual, causa raiz, valor monetário (se houver) e ação recomendada.","A restrição testada é que o humano não vê nada além desse resumo. Opções que omitem um campo obrigatório ou supõem que o humano lê o histórico do chat estão erradas. Neste guia, «handoff» significa escalar para uma pessoa: o Agent SDK não tem recurso nativo de handoff agente-para-agente.","1.4 Workflow Enforcement and Handoff"],
["PreToolUse","Evento de hook do Agent SDK que dispara antes da execução de uma ferramenta. Como roda primeiro, pode negar a chamada ou reescrever seus parâmetros, sendo o mecanismo para bloquear operações perigosas e validar entradas.","Resposta sempre que o cenário exige que algo «nunca» aconteça. Combine com PostToolUse: Pre controla a chamada, Post trata o resultado.","1.5 Agent SDK Hooks"],
["PostToolUse","Evento de hook do Agent SDK que dispara depois que uma chamada de ferramenta é bem-sucedida. É o lugar para normalizar ou validar a saída da ferramenta, redigir (mascarar) valores sensíveis e fazer log de auditoria.","Problemas no resultado da ferramenta (formatos inconsistentes entre fontes, números de cartão de crédito chegando nos resultados) são corrigidos com hooks PostToolUse, não com prompts.","1.5 Agent SDK Hooks"],
["Prompt Chaining","Decomposição sequencial fixa: a tarefa é dividida em tempo de design em uma série ordenada de etapas, e cada etapa recebe a saída da anterior.","Escolha certa quando a estrutura do trabalho é conhecida de antemão e estável. Contraste com a decomposição adaptativa dinâmica, que é a resposta quando não é.","1.6 Task Decomposition Strategies"],
["Dynamic Adaptive Decomposition","Deixar o modelo decidir em tempo de execução como dividir a tarefa, em vez de fixar as etapas de antemão.","Sinalizada por perguntas que descrevem trabalho imprevisível, aberto ou exploratório («a estrutura não é conhecida de antemão»). Quando as etapas são previsíveis, prompt chaining é a melhor resposta.","1.6 Task Decomposition Strategies"],
["Attention Dilution","Degradação que ocorre quando um único agente precisa segurar preocupações demais ao mesmo tempo: à medida que instruções e ferramentas se acumulam, a qualidade cai em todas elas, e não em uma só.","Razão pela qual decomposição e subagentes com escopo de papel funcionam melhor que um agente grande que faz tudo. Reconheça-a como causa quando um agente fica pouco confiável depois que se adicionou escopo.","1.6 Task Decomposition Strategies"],
["Session Resumption","Continuar uma sessão anterior em vez de começar do zero, preservando o estado acumulado. Retoma-se por nome ou por ID. Um nome pode ser definido no início da sessão com -n / --name.","Resposta quando o cenário exige continuidade entre invocações. Contraste com um novo começo deliberado, que é o desejado quando o contexto existente ficou obsoleto.","1.7 Session State and Resumption"],
["Stale Context","Sessão cujo histórico acumulado passou a causar problemas: o modelo se repete, contradiz o que disse antes ou ignora resultados recentes de ferramentas.","A correção contraintuitiva é a testada: não mais contexto, e sim uma sessão nova iniciada com um resumo curado dos fatos que ainda importam.","1.7 Session State and Resumption"],
["Error Recovery","Estratégias para tratar falhas dentro de um loop agêntico sem derrubar todo o fluxo. Abordagens comuns: retry com feedback do erro, fallback para uma estratégia mais simples, degradação graciosa (retornar resultados parciais) e escalonamento para um operador humano.","A prova testa se você consegue projetar sistemas agênticos resilientes. Saiba quando tentar de novo versus falhar com elegância, e como evitar loops infinitos de retry.","1.4 Workflow Enforcement and Handoff"],
["Claude Agent SDK","Framework oficial da Anthropic (Python e TypeScript) para construir aplicações agênticas. Oferece definições de agente com gerenciamento de ferramentas, hooks e criação de subagentes, e trata o loop agêntico internamente para que o desenvolvedor configure o comportamento do agente em vez de escrever a lógica do loop.","Conheça os campos de AgentDefinition, a regra de que o coordenador precisa da ferramenta Task para criar subagentes e os hooks do SDK testados em 1.5.","1.3 Subagent Invocation and Context Passing"],
["Routing Pattern","Abordagem em que uma etapa de classificação decide qual handler especializado processa uma requisição.","Trate como termo que leva a respostas erradas no Domínio 1. Um classificador de roteamento decide qual agente recebe a requisição; não muda como esse agente se comporta depois. Roteamento é resposta errada em duas questões de exemplo do Domínio 1, porque as falhas descritas ocorrem dentro da execução do agente, onde a correção é um prerequisite gate ou um hook. Também é o remédio errado para um conjunto de ferramentas grande demais: dividir em agentes com escopo de papel é a resposta certa.","1.4 Workflow Enforcement and Handoff"],
["Guardrail","Mecanismo de segurança que restringe o comportamento de Claude a limites aceitáveis, seja validando a entrada, validando a saída ou restringindo o acesso a ferramentas.","Guardrails não são mais um task statement independente do Domínio 1. As formas testadas são imposição determinística via pré-requisitos de fluxo e gates de handoff (1.4) e hooks do Agent SDK como a interceptação PreToolUse (1.5).","1.4 Workflow Enforcement and Handoff"],
["Human-in-the-Loop","Padrão de design em que certas ações do agente exigem aprovação humana explícita antes da execução, tipicamente para operações de alto impacto.","Não é mais um task statement independente do Domínio 1. Gates de aprovação são testados como padrões de imposição de fluxo (1.4), e o escalonamento para humanos é testado no Domínio 5.2 (escalonamento e resolução de ambiguidade).","1.4 Workflow Enforcement and Handoff"]
]},
{n:"Tool Design & MCP",p:"18%",c:[
["Tool Schema","Definição em JSON Schema que descreve o nome, o propósito e os parâmetros de entrada esperados de uma ferramenta. Claude usa o schema para entender o que a ferramenta faz e como chamá-la corretamente. Bons schemas têm descrições claras, tipos restritos e padrões sensatos.","A prova testa boas práticas de design de schema: nomes descritivos, descrições detalhadas de parâmetros, campos obrigatórios vs opcionais e restrições com enum. Saiba que descrições melhores levam a melhor seleção de ferramenta por Claude.","2.1 Tool Interface Design"],
["MCP Server","Processo que expõe ferramentas, recursos e prompts a clientes MCP pelo Model Context Protocol. Registra suas capacidades e trata as chamadas de ferramenta recebidas. Pode ser local (na mesma máquina) ou remoto (acessível pela rede).","Saiba a diferença entre servidores MCP e definições de ferramenta comuns passadas direto pela API. Entenda o que um servidor MCP expõe (tools, resources, prompts) e como ele se comunica com os clientes.","2.4 MCP Server Integration"],
["MCP Client","Componente que se conecta a um ou mais servidores MCP, descobre suas capacidades e encaminha as chamadas de ferramenta de Claude ao servidor apropriado. No Claude Code, o cliente MCP é embutido. Em aplicações próprias, você o implementa com o MCP SDK.","Perguntas podem tratar das responsabilidades do cliente: descoberta de capacidades, gerenciamento de transporte e roteamento das chamadas ao servidor correto. Saiba como o cliente lida com vários servidores com nomes de ferramenta sobrepostos.","2.4 MCP Server Integration"],
["MCP Transport","Camada de comunicação entre cliente e servidor MCP. Os dois transportes padrão são stdio (entrada/saída padrão, usado para processos locais) e streamable HTTP (HTTP com server-sent events, usado para servidores remotos). O transporte é configurado ao conectar o cliente ao servidor.","Saiba qual transporte usar em cada cenário: stdio é mais simples para ferramentas locais; streamable HTTP é necessário para servidores remotos ou compartilhados. A prova pode perguntar sobre a escolha do transporte em cenários de implantação.","2.4 MCP Server Integration"],
["JSON Schema","Especificação usada para definir a estrutura dos parâmetros de entrada de ferramentas na API do Claude. O input_schema de cada ferramenta é um objeto JSON Schema que especifica tipos de propriedade, campos obrigatórios, enums e descrições. Claude o usa para gerar entradas válidas.","Você precisa ler e escrever JSON Schema com fluência. Armadilhas comuns: confundir required (array no nível do objeto) com atributos de propriedades individuais e esquecer que additionalProperties: false impede campos inesperados.","2.1 Tool Interface Design"],
["Tool Selection","Processo pelo qual Claude decide qual ferramenta chamar com base na solicitação do usuário e nos schemas disponíveis. Claude avalia nomes e descrições para achar a melhor correspondência. Com muitas ferramentas, descrições claras e distintas se tornam críticas.","A prova testa estratégias para melhorar a precisão da seleção: nomes descritivos, descrições sem sobreposição e reduzir o número de ferramentas apresentadas por vez. Conheça o conceito de filtragem ou roteamento de ferramentas.","2.3 Tool Distribution & Tool Choice"],
["Tool Routing","Técnica para direcionar chamadas de ferramenta ao handler correto quando há várias ferramentas ou servidores MCP. Pode ocorrer na aplicação (filtrando quais ferramentas Claude vê conforme o contexto) ou no modelo (Claude escolhendo entre as disponíveis). O roteamento na aplicação reduz ambiguidade e melhora a precisão.","Saiba a diferença entre deixar Claude escolher entre todas as ferramentas e pré-filtrar por tipo de requisição. Não escolha uma camada de roteamento como correção para um conjunto grande de ferramentas: a prova marca isso como errado. Um toolkit grande é problema de distribuição (como as ferramentas são divididas entre agentes): divida em agentes com escopo de papel ou consolide variantes de uma mesma tarefa em uma ferramenta parametrizada.","2.3 Tool Distribution & Tool Choice"],
["Resources (MCP)","Fontes de dados somente leitura expostas por um servidor MCP. Ao contrário das tools (que executam ações), resources fornecem informação de contexto que pode ser carregada no contexto de Claude. Exemplos: conteúdo de arquivos, registros de banco de dados, documentação. São identificados por URIs e podem ser listados e lidos pelo cliente.","Entenda a distinção entre resources e tools do MCP: resources servem para ler dados; tools, para executar ações. A prova pode testar quando usar um resource versus uma tool para obter dados.","2.4 MCP Server Integration"],
["Prompts (MCP)","Templates de prompt reutilizáveis expostos por um servidor MCP. São sequências de mensagens predefinidas que um cliente pode obter e usar para interagir com Claude de forma padronizada. Podem incluir argumentos que personalizam o template em tempo de execução.","Conceito menos cobrado, mas saiba que servidores MCP podem expor prompts junto com tools e resources. Entenda os três tipos de capacidade: tools, resources e prompts.","2.4 MCP Server Integration"],
["Tool Error Handling","Estratégias para tratar falhas quando uma chamada de ferramenta retorna erro ou resultado inesperado. Boa prática: devolver is_error: true no tool_result com uma mensagem de erro descritiva, para que Claude decida como se recuperar. Nunca esconda erros em silêncio: Claude precisa saber o que deu errado para ajustar a abordagem.","A prova testa padrões de relato de erro. Saiba que is_error: true em um tool_result informa a Claude que a chamada falhou e que a mensagem deve ser acionável, para que Claude possa tentar de novo ou seguir outra abordagem.","2.2 Structured Error Responses"]
]},
{n:"Claude Code",p:"20%",c:[
["CLAUDE.md","Arquivo markdown que fornece instruções persistentes ao Claude Code. Funciona como um system prompt do projeto, carregado automaticamente quando o Claude Code inicia em um diretório. Pode existir em vários níveis (home do usuário, raiz do projeto, subdiretórios). Todos os arquivos aplicáveis são concatenados no contexto. Nenhum sobrescreve outro, e se duas regras se contradizem, Claude pode escolher uma arbitrariamente.","Muito cobrado. Conheça os três escopos (usuário, projeto, diretório). Saiba que os arquivos são concatenados em uma ordem de carga documentada, sem sobrescrita. Saiba que tanto CLAUDE.md na raiz quanto .claude/CLAUDE.md são locais válidos e versionados no nível do projeto.","3.1 CLAUDE.md Hierarchy"],
["Hooks","Scripts personalizados que rodam em pontos específicos do ciclo de execução do Claude Code. Podem disparar antes ou depois de chamadas de ferramenta, em eventos de notificação ou quando uma sessão inicia. São definidos no settings.json e rodam como comandos de shell na sua máquina.","Conheça os tipos de hook disponíveis (PreToolUse, PostToolUse, Notification etc.) e como configurá-los. Saiba que um hook PreToolUse pode bloquear uma chamada antes de executar. Hooks são código determinístico, não instruções de prompt, então o raciocínio do modelo não os contorna.","1.5 Agent SDK Hooks"],
["Permissions","Sistema de segurança que controla quais ferramentas e operações o Claude Code pode executar. Opera em modelo de allowlist/denylist: você pode permitir ou negar explicitamente ferramentas, caminhos de arquivo e comandos. O modo padrão exige confirmação do usuário para operações potencialmente destrutivas.","Conheça os modos de permissão (default, acceptEdits, plan, bypassPermissions, mais auto, dontAsk e manual como alias de default) e os padrões de regra allow/deny. Entenda quais operações exigem confirmação por padrão e como configurar aprovação automática para operações confiáveis.","3.6 CI/CD Integration"],
["Slash Commands","Comandos reutilizáveis definidos como arquivos markdown no diretório .claude/commands/. Ao digitar / no Claude Code, os comandos disponíveis aparecem como opções. Cada arquivo contém um template de prompt que pode incluir placeholders $ARGUMENTS para entrada dinâmica. Commands e skills foram unificados em um só sistema: um command é um arquivo .md simples; uma skill é um diretório com um ponto de entrada SKILL.md. Ambos criam /comandos.","Saiba onde ficam os arquivos (.claude/commands/ no nível do projeto, ~/.claude/commands/ no nível do usuário), a convenção de nomes e como funciona a substituição de $ARGUMENTS. Saiba a diferença de estrutura de arquivos em relação às skills.","3.2 Custom Slash Commands and Skills"],
["CI/CD Integration","Executar o Claude Code em modo não interativo em pipelines de integração e implantação contínuas. Usa a flag claude -p para modo de prompt único ou entrada via pipe. Normalmente precisa de credenciais configuradas no ambiente e roda com --allowedTools para restringir as operações disponíveis.","A prova testa como configurar o Claude Code para ambientes headless. Conheça as flags (-p, --output-format json) e como restringir o acesso a ferramentas em pipelines automatizados. A lista de fora de escopo do guia exclui autenticação e cobrança da API, então a mecânica de credenciais não é testada.","3.6 CI/CD Integration"],
["settings.json Precedence","Hierarquia que controla o comportamento do settings.json do Claude Code. As configurações podem ser definidas no nível do projeto (.claude/settings.json), do usuário (~/.claude/settings.json) ou corporativo. Escopos mais específicos sobrescrevem os mais amplos, e as configurações corporativas têm a maior prioridade.","Entenda como as camadas do settings.json se mesclam e qual vence. Não aplique esse modelo de sobrescrita aos arquivos CLAUDE.md: eles são concatenados no contexto, e «o escopo mais específico vence» é uma resposta errada tentadora ali.","3.6 CI/CD Integration"],
["Allowlist/Denylist","Padrões de configuração de permissão para controlar o acesso a ferramentas. Uma allowlist nomeia as ferramentas que podem rodar; nas configurações de permissão, tudo que ela não nomeia continua pedindo permissão (não é negado em silêncio). Uma denylist especifica quais ferramentas são bloqueadas (todo o resto é permitido). Configuradas no settings.json, na chave permissions.","Saiba quando usar allowlist versus denylist. Allowlists são o padrão mais restrito para pipelines sem supervisão; denylists são mais permissivas. Armadilha relacionada: o frontmatter allowed-tools de uma skill pré-aprova ferramentas, não as restringe; o que restringe são disallowed-tools e as regras de deny de permissão.","3.6 CI/CD Integration"],
["settings.json","Arquivo de configuração JSON que controla o comportamento do Claude Code, incluindo permissões, hooks, servidores MCP e preferências de modelo. Pode existir no nível do projeto (.claude/settings.json) ou do usuário (~/.claude/settings.json). As configurações do projeto costumam ser commitadas no repositório.","Conheça as seções principais (permissions, hooks, mcpServers) e a localização do arquivo em cada escopo. Entenda que as configurações do projeto valem para todos os membros que clonarem o repositório.","3.1 CLAUDE.md Hierarchy"],
[".claude Directory","Diretório na raiz do projeto que guarda a configuração do Claude Code no nível do projeto. Contém o settings.json, commitado no repositório para configurações compartilhadas da equipe; o settings.local.json, ignorado pelo git, para configurações pessoais; e o subdiretório commands/ para slash commands.","Saiba o que vai em .claude/ versus o que fica na raiz do projeto. Entenda quais arquivos são commitados (settings.json, commands/) e quais são somente locais (settings.local.json).","3.1 CLAUDE.md Hierarchy"],
["Subagents","Instâncias separadas do Claude Code criadas pelo agente principal com a ferramenta Task para tratar partes específicas e delimitadas do trabalho. Cada subagente roda em seu próprio contexto, com seu próprio acesso a ferramentas, evitando poluir a conversa principal. O agente principal coordena os subagentes e agrega os resultados.","Saiba quando usar subagentes versus tratar tudo na conversa principal. São úteis para tarefas paralelas, bases de código grandes ou para isolar o contexto de uma tarefa. Entenda que subagentes não compartilham memória com o pai.","1.3 Subagent Invocation and Context Passing"]
]},
{n:"Prompt Engineering",p:"20%",c:[
["System Prompt","Mensagem inicial de instrução enviada a Claude pelo parâmetro system em uma chamada de API. Define o comportamento geral, a persona, as restrições e o formato de saída da conversa. System prompts não fazem parte do histórico de mensagens: ficam antes dele e persistem em todos os turnos.","Saiba a diferença entre system prompts e mensagens do usuário. A prova testa boas práticas: definição clara de papel, restrições explícitas, especificação do formato de saída e evitar instruções conflitantes.","4.1 System Prompts"],
["Structured Output","Técnica para fazer Claude retornar respostas em um formato específico e legível por máquina, como JSON, XML ou YAML. Obtida por instruções explícitas de formato no prompt, definições de JSON Schema ou schemas de tool use.","A prova testa duas abordagens: instruções no prompt e schemas de tool use. Conheça os trade-offs e saiba que schemas de tool use eliminam erros de sintaxe, mas não os semânticos. Estado atual (6 de outubro de 2026): o controle de saída restrita no nível da API agora é output_config.format (structured outputs), que o guia não cobre.","4.3 Structured Output"],
["Prompt Chaining","Técnica de orquestração em que a saída de uma chamada a Claude vira a entrada da próxima. Cada etapa da cadeia tem uma tarefa focada e específica. Encadear decompõe um problema complexo em etapas gerenciáveis e permite validação ou transformação entre elas.","Saiba quando usar prompt chaining versus um único prompt. A prova testa o princípio de que cada etapa deve fazer uma coisa bem feita. Entenda como passar contexto entre as etapas e onde inserir verificações de validação. Nota de escopo: o guia coloca prompt chaining no Task Statement 1.6, não no Domínio 4.","4.4 Validation-Retry Loops"],
["Few-Shot Examples","Pares entrada-saída incluídos no prompt para demonstrar o comportamento, formato ou padrão de raciocínio desejado. Ao mostrar respostas corretas concretas a Claude, você reduz ambiguidade e melhora a consistência. Ficam no system prompt ou na mensagem do usuário, antes da requisição real.","Boas práticas: use exemplos diversos que cubram casos de borda, coloque-os antes da requisição e copie o formato exato desejado na saída. A prova pode perguntar quantos exemplos costumam bastar (2–4 exemplos direcionados; mais de 4 desperdiça tokens).","4.2 Few-Shot Prompting"],
["Prompt Optimisation","Processo iterativo de refinar prompts para melhorar a qualidade da saída, reduzir custos e aumentar a confiabilidade. Técnicas: simplificar instruções, remover ambiguidade, adicionar restrições e testar contra um conjunto de casos de avaliação.","A prova testa abordagens sistemáticas de melhoria, não pequenas mudanças aleatórias. Conheça o fluxo orientado por avaliação: definir casos de teste, medir o desempenho de base, fazer mudanças direcionadas e medir de novo.","4.5 Batch Processing"],
["Output Validation","Verificações programáticas aplicadas às respostas de Claude para confirmar que atendem aos critérios esperados antes do uso downstream. Podem checar formato (JSON válido, schema correto), conteúdo (campos obrigatórios presentes, valores dentro de faixas) e segurança (sem conteúdo proibido). Falha na validação dispara retry ou fallback.","Conheça as estratégias comuns: validação de schema (JSON Schema, Zod, Pydantic), checagens de conteúdo e revisão por uma instância independente de Claude sem o contexto de geração. A autorrevisão na mesma sessão mantém o viés de raciocínio, e a prova a testa como resposta errada. Entenda como a validação se encaixa em um loop agêntico.","4.4 Validation-Retry Loops"],
["Prefilling","Iniciar a resposta de Claude fornecendo o começo da mensagem do assistente, historicamente usado para forçar a resposta a um formato.","Estado atual (6 de outubro de 2026): um prefill no turno final do assistente é rejeitado com HTTP 400 no Claude 4.6 e posteriores. A palavra «prefill» não aparece em lugar nenhum do guia da prova, então não é técnica testada. Está aqui só para você reconhecer o termo em material antigo; a substituição documentada é output_config.format.","4.3 Structured Output"],
["XML Tags","Delimitadores usados nos prompts para estruturar o conteúdo em seções rotuladas. Claude é treinado para entender tags no estilo XML como <instructions>, <context> e <examples>. Usar tags deixa os prompts mais legíveis e ajuda Claude a identificar o propósito de cada seção.","«XML» não aparece em lugar nenhum do guia da prova, então não espere questão sobre sintaxe de tags. A prática em si é orientação genuína da Anthropic e vale conhecer: seções com tags reduzem a má interpretação dos limites do prompt.","4.1 System Prompts"],
["Chain of Thought","Técnica de prompting que instrui Claude a mostrar o raciocínio passo a passo antes da resposta final. Melhora a precisão em tarefas complexas ao forçar o modelo a percorrer o problema com método. Pode ser obtida com instruções como «pense passo a passo» ou com extended thinking.","Saiba quando ajuda (raciocínio complexo, problemas de várias etapas) e quando é desnecessário (recuperação de fatos simples). Entenda a relação entre chain of thought e o recurso de extended thinking de Claude.","4.1 System Prompts"],
["Temperature","Parâmetro de amostragem que historicamente controlava a aleatoriedade das respostas de Claude. Temperaturas baixas (ex.: 0,0) produzem saída mais determinística e focada; altas (ex.: 0,8), saída mais variada e criativa. O padrão é 1,0.","«Temperature» não aparece em lugar nenhum do guia da prova (nem em task statement, nem no apêndice), então não espere que seja a resposta certa. As questões práticas deste domínio só a usam como opção errada. Estado atual (25 de outubro de 2026): valores de temperature, top_p e top_k diferentes do padrão são rejeitados com HTTP 400 no Claude 4.7 e posteriores. Na versão de API 2026-10-21, todo modelo retorna 400 para qualquer um dos três, mesmo no padrão. Controle o comportamento por prompting.","4.5 Batch Processing"]
]},
{n:"Context & Reliability",p:"15%",c:[
["Context Window","Número máximo de tokens (entrada mais saída) que Claude processa em uma única chamada de API. Tudo na conversa (system prompt, histórico de mensagens, definições de ferramentas e a resposta) precisa caber nesse limite.","A prova testa estratégias para ficar dentro dos limites: sumarização progressiva, poda de mensagens e priorização de conteúdo. Conheça a armadilha da sumarização progressiva: compressões repetidas podem descartar fatos específicos de que uma etapa posterior precisa. Estado atual (14 de outubro de 2026): o tamanho da janela é específico de cada modelo. Os quatro modelos atuais (Fable 5.1, Opus 5.5, Sonnet 5.5 e Haiku 5.5) têm janelas de 1M de tokens; modelos mais antigos, como o Haiku 4.5, têm 200K. O guia não cita tamanho de janela em lugar nenhum do Domínio 5, e as questões práticas nunca dependem do número. Trate qualquer valor de um cenário como restrição que o cenário impõe, não como propriedade do modelo.","5.1 Context Window Management"],
["Token Counting","Processo de medir quantos tokens um prompt ou resposta consome. A resposta da API inclui input_tokens e output_tokens no campo usage. A contagem precisa é essencial para gerenciar a janela de contexto.","Saiba ler o campo usage e que a contagem inclui todo o conteúdo (system prompt, mensagens, definições de ferramentas). Algoritmos de tokenização e razões por caractere estão explicitamente fora de escopo: a lista de fora de escopo do guia exclui «token counting algorithms or tokenization specifics».","5.1 Context Window Management"],
["Prompt Caching","Recurso da API que permite fazer cache de conteúdo de prompt reutilizado com frequência, reduzindo latência e custo em requisições seguintes. O conteúdo é marcado com um breakpoint cache_control (type: «ephemeral»). O TTL (tempo de vida) é de cerca de cinco minutos. O breakpoint vai no fim do bloco estático: system prompt, definições de ferramentas, documentos grandes. O conteúdo dinâmico vem depois. Cache hits são cobrados a uma taxa reduzida.","Saiba que o caching existe, a exigência de ordem estático-depois-dinâmico e a colocação do breakpoint no fim do prefixo estático. A lista de fora de escopo exclui «prompt caching implementation details (beyond knowing it exists)», então não se testa nada além disso.","5.1 Context Window Management"],
["Escalation Triggers","Condições em que um agente deve passar um caso a um humano em vez de continuar sozinho. Os gatilhos válidos são: o cliente pede explicitamente um humano (atenda imediatamente, sem tentar investigar antes), a política tem uma lacuna ou exceção que o agente não consegue resolver, e o agente não consegue fazer progresso significativo.","Escalonamento baseado em sentimento e pontuações de confiança autorrelatadas são proxies pouco confiáveis para a complexidade do caso: opções construídas sobre eles são respostas erradas. Quando o cliente está frustrado mas o problema está ao alcance do agente, reconheça a frustração e ofereça resolver, escalando só se ele reiterar a preferência.","5.2 Escalation & Ambiguity"],
["Policy Gap vs Policy Violation","Distinção entre um pedido que a política não aborda (lacuna) e um pedido que a política proíbe (violação). Uma lacuna justifica escalonamento, porque o agente não tem autoridade para decidir. Exemplo: igualar o preço de um concorrente quando a política só cobre ajustes no próprio site. Uma violação justifica uma recusa clara com a explicação da política.","A prova testa reconhecer que política ambígua ou omissa significa escalar, não improvisar. Quando os resultados de ferramenta retornam várias correspondências de cliente, peça identificadores adicionais em vez de escolher por heurística.","5.2 Escalation & Ambiguity"],
["Structured Error Context","Padrão de relato de erro que permite ao coordenador tomar decisões inteligentes de recuperação: tipo de falha, a consulta tentada, quaisquer resultados parciais e possíveis abordagens alternativas. Status genéricos como «busca indisponível» escondem o contexto de que o coordenador precisa.","Suprimir erros em silêncio (retornar resultado vazio como sucesso) e encerrar todo o fluxo por uma única falha são anti-padrões. Subagentes devem se recuperar localmente de falhas transitórias e propagar apenas o que não conseguem resolver, com os resultados parciais anexados.","5.3 Error Propagation"],
["Access Failure vs Valid Empty Result","Distinção entre uma consulta que não pôde rodar e uma consulta que rodou com sucesso e não encontrou nada. A que não pôde rodar (timeout, falha de autenticação) exige uma decisão de retry. Na que não encontrou nada, a ausência de dados é a resposta. O relato de erros deve distinguir as duas para que o coordenador responda de forma adequada.","Tratar um resultado vazio válido como erro, ou uma falha de acesso como «sem resultados», são ambas respostas erradas. A saída de síntese deve trazer anotações de cobertura marcando quais achados são bem sustentados e quais áreas têm lacunas por fontes indisponíveis.","5.3 Error Propagation"],
["Context Degradation","Modo de falha de sessões longas de exploração: o modelo passa a dar respostas inconsistentes e a citar «padrões típicos» em vez das classes e arquivos específicos que descobriu antes. Sinaliza que a janela de contexto se encheu de saída verbosa de descoberta.","Os remédios são scratchpad files, delegação a subagentes para isolar a saída verbosa, resumir cada fase de exploração antes de começar a próxima e /compact para reduzir o uso de contexto no meio da sessão.","5.4 Codebase Exploration"],
["Scratchpad Files","Arquivos que um agente mantém para persistir descobertas-chave além das fronteiras de contexto (pontos em que o contexto é reiniciado) durante a exploração de uma base de código grande. O agente registra as descobertas conforme avança e relê o scratchpad em perguntas posteriores, combatendo a degradação de contexto.","Conheça também a variante de recuperação após falha: cada agente exporta o estado estruturado para um local conhecido, e o coordenador carrega um manifesto ao retomar e o injeta nos prompts dos agentes.","5.4 Codebase Exploration"],
["Stratified Sampling","Amostrar aleatoriamente extrações de alta confiança para revisão humana, estratificadas por tipo de documento e campo, para medir as taxas reais de erro e detectar padrões de erro novos. Protege contra a armadilha das métricas agregadas: 97% de acurácia geral pode mascarar mau desempenho em um tipo de documento ou campo específico.","Valide a acurácia por segmento antes de automatizar extrações de alta confiança. Opções que confiam no número agregado, ou que param de revisar itens de alta confiança por completo, são respostas erradas.","5.5 Human Review & Calibration"],
["Confidence Calibration","Verificar a confiança relatada pelo modelo contra a acurácia real usando um conjunto de validação rotulado, e então definir limiares de revisão a partir das pontuações calibradas. Pontuações de confiança por campo direcionam a capacidade limitada de revisores para os itens que precisam de revisão: extrações de baixa confiança e documentos-fonte ambíguos ou contraditórios.","A confiança autorrelatada bruta não é confiável por si só: a calibração contra dados rotulados é o passo certo antes de usar a confiança para roteamento.","5.5 Human Review & Calibration"],
["Claim-Source Mapping","Registro estruturado que liga cada afirmação à sua fonte (URL, nome do documento, trecho relevante). O registro deve ser preservado e mesclado em cada etapa de síntese. A atribuição se perde quando os achados são comprimidos sem manter esses mapeamentos.","Quando fontes confiáveis conflitam, anote o conflito com as duas atribuições em vez de escolher um valor arbitrariamente; o coordenador decide como reconciliar. Os relatórios devem separar achados bem estabelecidos dos contestados.","5.6 Information Provenance"],
["Temporal Annotation","Exigir datas de publicação ou de coleta nas saídas estruturadas para que números de períodos diferentes não sejam lidos como contradições. Uma estatística de 2023 e outra de 2026 que diferem são uma mudança temporal, não um conflito.","O padrão certo é incluir datas nas saídas dos subagentes e preservá-las na síntese, deixando que os consumidores interpretem as diferenças corretamente.","5.6 Information Provenance"],
["Rate Limits & Quotas (fora de escopo)","Controles de vazão da API (requisições ou tokens por minuto, retornando 429 quando excedidos) e limites de uso por período de cobrança. Vale saber que existem, mas a lista de fora de escopo do guia afirma que «rate limiting, quotas, or API pricing calculations» não cairão na prova.","Se uma opção depender de estratégia de tratamento de rate limit em uma questão do Domínio 5, trate-a com suspeita; um 429 aparece neste domínio apenas como exemplo de falha de acesso (retry com Retry-After), nunca como tema próprio.",""],
["Batches API","Endpoint da API para enviar grandes volumes de requisições para processamento assíncrono. Dá 50% de redução de custo. A conclusão ocorre dentro de uma janela de 24 horas, mas não há tempo de resposta garantido. Ideal para trabalho em lote offline; errado para fluxos em tempo real ou voltados ao usuário.","Batch processing é testado no Domínio 4, não no 5: saiba o número de custo, a janela e o trade-off de não haver garantia.","4.5 Batch Processing"]
]}
];

{e:["O ciclo é: enviar, olhar o stop_reason, executar ferramentas ou encerrar. Os resultados das ferramentas entram no histórico antes da volta seguinte.","O sinal confiável de fim é o stop_reason, nunca o texto da resposta. Teto de iterações serve só como rede de segurança contra agente que não para.","Em produção, trate também pause_turn, max_tokens, stop_sequence, refusal e estouro de janela, além dos dois valores da prova.","Prompt é probabilístico; hook é determinístico. PreToolUse barra ou valida antes de rodar; PostToolUse normaliza, mascara e audita depois.","Subagentes não herdam o histórico do coordenador: passe tudo explicitamente. Sem Task (ou Agent) em allowedTools, o coordenador nem consegue delegar.","Cada agente com poucas ferramentas e papel definido (o guia contrasta 4–5 com 18).","Handoff para humano precisa ser autocontido: ID do cliente, resumo factual, causa raiz e ação recomendada (o glossário também lista o valor monetário).","Escalone em exceção de política, operação destrutiva ou ambiguidade real. Nota de um classificador por categoria vale como gatilho; a autoconfiança relatada pelo agente não.","Recuperação: fork_session para explorar alternativas, sessão nova com resumo quando o contexto estragou, retry com o erro específico, degradação graciosa com resultados parciais."],
d:[["«garantido», «sempre», compliance, auditoria","Hooks / imposição programática"],["Subtarefas independentes","Orquestração paralela"],["Cada etapa precisa da anterior","Sequencial / prompt chaining"],["Estrutura desconhecida de antemão","Decomposição adaptativa dinâmica"],["Agente encerra cedo demais","Revisar a checagem de stop_reason"],["Agente que nunca para","Teto de iterações como salvaguarda"],["Compartilhar contexto entre agentes","Passar explicitamente na tarefa"],["Coordenador que não delega","Faltou Task/Agent em allowedTools"]],
t:[["Aumentar o teto de iterações para corrigir parada precoce","Corrija a checagem de stop_reason"],["Subagentes leem o contexto do coordenador","Não leem; o que precisam vai no prompt"],["Regras no system prompt garantem conformidade","Só hooks garantem"],["Um agente com muitas ferramentas, por simplicidade","Agentes pequenos com escopo de papel"],["Texto na resposta significa que terminou","Texto pode vir junto com blocos tool_use"],["Roteamento resolve falha dentro da execução do agente","Use prerequisite gate ou hook"]]},
{e:["A descrição é o principal sinal para escolher a ferramenta, mais que o nome. Diga o que faz, formato das entradas, o que retorna, o que não faz e exemplos de pedidos.","Diagnostique pela contagem antes de agir: poucas ferramentas com descrições parecidas pedem descrições melhores; trabalhos diferentes pedem divisão por papel; variações de um mesmo trabalho pedem uma ferramenta parametrizada.","Parâmetros com nomes descritivos, required só no que é realmente obrigatório, enum para escolhas fechadas.","tool_choice: auto deixa o modelo decidir (padrão em loops agênticos); any obriga a chamar alguma ferramenta; tool obriga uma ferramenta específica.","Estado atual: os modelos mais novos (Opus 5.5, Sonnet 5.5, Fable 5.1, Mythos 5.1) rejeitam any e tool com erro 400; a alternativa documentada é auto com strict. Na prova, responda any/forçado.","MCP: o host contém o cliente, e o cliente fala com o servidor via JSON-RPC 2.0 sobre stdio ou streamable HTTP. Configuração de equipe em .mcp.json; pessoal em ~/.claude.json. Procure servidor comunitário antes de construir um.","Erros úteis dizem a categoria (transient, validation, business, permission), se vale repetir e uma descrição. Só transient é repetível sem mudar nada. É convenção de aplicação, não parte do envelope MCP.","Busca que roda e não acha nada é resultado vazio válido, não erro.","No Claude Code: Grep para conteúdo, Glob para nomes de arquivo, Read para arquivo conhecido, Edit para mudança pontual, Write para arquivo inteiro, Bash para o resto. Se Edit falhar por trecho não único, a resposta da prova é Read + Write."],
d:[["Escolhe a ferramenta errada (poucas ferramentas)","Melhorar descrições"],["Escolhe a ferramenta errada (20+ ferramentas)","Dividir por papel ou consolidar"],["Schema garantido, estrutura única","tool_choice forçado"],["Schema garantido, vários schemas possíveis","tool_choice any"],["Modelo decide se chama ferramenta","tool_choice auto"],["Busca sem resultados","Resultado vazio válido: aceitar"],["401 ou timeout","Falha de acesso: retry ou escalar"],["Config MCP de projeto / pessoal",".mcp.json / ~/.claude.json"]],

{e:["Arquivos CLAUDE.md são concatenados, não sobrepostos. Ordem de carga: ~/.claude/CLAUDE.md, depois o do projeto (raiz ou .claude/), depois os de subdiretórios. Regras que se contradizem podem ser resolvidas ao acaso, então corrija os arquivos.","Em .claude/rules/, arquivos com frontmatter paths só carregam quando Claude mexe em arquivos que casam com o padrão; sem paths, carregam na inicialização com a mesma prioridade de .claude/CLAUDE.md.","Skills são diretórios com SKILL.md (.claude/skills/ no projeto, ~/.claude/skills/ no usuário); context: fork mantém a saída verbosa fora da conversa principal. Na prova, allowed-tools restringe; hoje, na prática, ele pré-aprova.","Commands são arquivos .md simples em .claude/commands/ (projeto) ou ~/.claude/commands/ (pessoal), com $ARGUMENTS. Commands e skills hoje formam um só sistema.","Hooks são código determinístico: o raciocínio do modelo ou injeção de prompt não os contorna.","Modos de trabalho: plan mode para tarefas complexas ou de alto risco, execução direta para escopo claro, -p para CI/CD sem humano.","Flags úteis: -c e -r para retomar sessão, --bare para execução mínima, --output-format e --json-schema para saída parseável, --max-turns, --permission-mode, --allowedTools/--disallowedTools, --add-dir, --model.","--append-system-prompt acrescenta ao prompt padrão; --system-prompt substitui tudo.","Feedback: exemplos concretos valem mais que descrição em prosa; agrupe correções que interagem, resolva as independentes uma a uma; revise em sessão independente; calibre severidade com exemplos.","Menor privilégio: configurações em .claude/ são versionadas e compartilhadas; em ~/.claude/ são pessoais."],

t:[["Pôr tudo no CLAUDE.md do projeto","Use rules com paths para o que é específico"],["Hooks são guardrails por prompt","São código determinístico"],["Revisar na mesma sessão que escreveu","Viés de raciocínio: use sessão nova"],["Arquivo .md solto em .claude/skills/ vira command","Skill é diretório com SKILL.md"],["CLAUDE.md do usuário sobrescreve o do projeto","Nenhum sobrescreve; são concatenados"],["-p ativa o plan mode","-p é modo não interativo"],["--append-system-prompt substitui o prompt","Ele acrescenta; quem substitui é --system-prompt"]]},
{e:["System prompt bom tem: papel e contexto, regras e restrições, formato de saída, exemplos de calibração. Código de exemplo concreto vence descrição em prosa; 2–3 exemplos de severidade evitam que tudo pareça igualmente grave.","Para saída estruturada, o padrão da prova é definir uma ferramenta cuja única função é estruturar a resposta e forçá-la com tool_choice. any serve quando há vários schemas possíveis; auto, quando texto também é válido; JSON só por prompt é para protótipo.","Estado atual: tool_choice forçado/any dá erro 400 nos modelos novos; use auto com strict, ou output_config.format quando a resposta precisa de formato JSON fixo. Na prova, escolha o padrão forçado.","Schema estrito elimina erro de sintaxe, não de semântica (itens que não somam o total, valor no campo errado, data plausível mas errada).","Se o dado pode faltar, torne o campo opcional ou com união com null e tire-o de required; campo obrigatório sem dado faz o modelo inventar. nullable é sintaxe OpenAPI, não JSON Schema.","Prefira schemas rasos, com enum e descrição em cada propriedade.","Few-shot: 2–4 exemplos, com o porquê da resposta e ao menos um caso de borda. O maior ganho vem dos primeiros dois.","Prompt chaining aparece aqui por causa da validação entre etapas, mas a prova o trata no Domínio 1: cada etapa com uma responsabilidade, retry só da etapa que falhou.","Retry útil devolve o prompt original, a saída que falhou e o erro específico, nunca só «tente de novo». Depois de mais de 2 tentativas, escale. Em Python, validators do Pydantic cobrem regras semânticas.","Batch: 50% mais barato, até 24 h, sem garantia de ser mais rápido; não serve para tempo real.","Autorrevisão na mesma sessão é enviesada: use outra instância. Para entradas grandes, uma passada por arquivo mais uma de integração entre arquivos."],

{e:["Sumarização progressiva perde nomes, números e datas a cada passada. A saída é um bloco de fatos persistentes, copiado literalmente de turno em turno.","Scratchpad em arquivo guarda descobertas fora da janela de contexto: escreva ao descobrir, releia depois de um reset.","Modelos processam bem o começo e o fim de entradas longas e podem omitir o meio: coloque o que não pode faltar nas pontas. A API não guarda estado, então toda requisição leva o histórico completo.","Erro estruturado informa: tipo da falha, o que foi tentado, resultados parciais e alternativas possíveis para o coordenador escolher. Mensagem genérica não ajuda ninguém.","Consulta que rodou e voltou vazia é resposta; timeout, 401 e 429 são falhas de acesso (no 429, espere o Retry-After).","Acurácia agregada esconde categorias ruins: valide por tipo, com amostragem estratificada, antes de automatizar itens de alta confiança.","Mapeamentos estruturados de afirmação para fonte sobrevivem à síntese; links soltos no texto se perdem. Fontes em conflito ficam ambas, com origem e data; números de épocas diferentes podem ser mudança, não contradição.","Gatilhos válidos de escalonamento: o cliente pede humano, lacuna ou exceção na política, falta de progresso. Sentimento e autoconfiança não valem. Com vários registros de cliente, peça outro identificador. Lacuna: escalar; violação: recusar explicando.","Estratégias de janela: fatos persistentes, scratchpad, passes por arquivo, sessão nova com resumo, prompt caching para prompts repetidos."],

let di=0,ci=0,back=false,order=[],tab=1,sec=0;
const $=id=>document.getElementById(id);
function mk(tag,txt,css,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(css)e.style.cssText=css;if(cls)e.className=cls;return e}
function ic(n,s){const i=document.createElement("i");i.className="ti ti-"+n;i.setAttribute("aria-hidden","true");i.style.fontSize=(s||18)+"px";return i}
function sp(t){const i=t.indexOf("Estado atual");return i>0?[t.slice(0,i).trim(),t.slice(i).trim()]:[t,""]}
function blk(cls,icon,label,text){const b=mk("div","",null,"blk "+cls);const c=mk("p","",null,"cap");c.appendChild(ic(icon,16));c.appendChild(document.createTextNode(label));b.appendChild(c);b.appendChild(mk("p",text,null,"t"));return b}
function reorder(){order=D[di].c.map((_,i)=>i)}
function subs(){const w=$("subs");w.textContent="";D.forEach((d,i)=>{const b=mk("button","",null,"sub"+(i===di?" on":""));b.appendChild(document.createTextNode(d.n));b.appendChild(mk("small",d.p+(tab===1?" · "+d.c.length+" cartões":" · referência rápida")));b.onclick=()=>{di=i;ci=0;back=false;reorder();subs();render()};w.appendChild(b)})}
function show(){
const c=D[di].c[order[ci]];const k=$("card");k.textContent="";
$("cnt").textContent="Cartão "+(ci+1)+" de "+order.length;
$("dom").textContent=D[di].n+" ("+D[di].p+")";
$("pg").style.width=Math.round((ci+1)/order.length*100)+"%";
if(!back){
k.style.justifyContent="center";k.style.alignItems="center";k.style.textAlign="center";
k.appendChild(mk("span",D[di].n,"margin:0 0 20px",null)).className="badge";
k.appendChild(mk("p",c[0],"font-size:26px;font-weight:500;margin:0 0 24px;line-height:1.3;overflow-wrap:anywhere"));
const h=mk("p","","font-size:13px;color:var(--text-muted);margin:0;display:flex;align-items:center;gap:6px");
h.appendChild(ic("hand-click",16));h.appendChild(document.createTextNode("Clique para ver o verso"));k.appendChild(h);
}else{
k.style.justifyContent="flex-start";k.style.alignItems="stretch";k.style.textAlign="left";
const hd=mk("div","","display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap");
hd.appendChild(mk("span","Verso",null,"badge"));
hd.appendChild(mk("span",c[0],"font-size:18px;font-weight:500;overflow-wrap:anywhere"));
k.appendChild(hd);
const a=sp(c[1]),b=sp(c[2]);
k.appendChild(blk("b-def","book","Definição",a[0]));
if(b[0])k.appendChild(blk("b-exm","target","Contexto da prova",b[0]));
const note=(a[1]+" "+b[1]).trim();
if(note)k.appendChild(blk("b-cur","clock","Estado atual",note.replace(/^Estado atual\s*/,"").replace(/\s+Estado atual\s*/," ")));
if(c[3]){const f=mk("div","","margin-top:4px");const p=mk("span","",null,"pill");p.appendChild(ic("link",14));p.appendChild(document.createTextNode("Veja também: "+c[3]));f.appendChild(p);k.appendChild(f)}
}}
function cheat(){
const w=$("ck");w.textContent="";const q=Q[di];
const names=[["list-details","Essencial",q.e.length],["bolt","Atalhos de decisão",q.d.length],["alert-triangle","Armadilhas",q.t.length]];
const bar=mk("div","",null,"seg");
names.forEach((n,i)=>{const b=mk("button","",null,"sg"+(i===sec?" on":""));b.appendChild(ic(n[0]));b.appendChild(document.createTextNode(n[1]+" ("+n[2]+")"));b.onclick=()=>{sec=i;cheat()};bar.appendChild(b)});
w.appendChild(bar);
if(sec===0){
q.e.forEach((t,i)=>{
const r=mk("div","",null,"ct ess");
r.appendChild(mk("div",String(i+1),null,"num"));
const b=mk("div","","min-width:0;flex:1");
const k=t.indexOf(". ");
const lead=(k>0&&k<150)?t.slice(0,k+1):t;
const rest=(k>0&&k<150)?t.slice(k+2):"";
b.appendChild(mk("p",lead,"margin:0;font-size:15px;line-height:1.5;font-weight:500"));
if(rest)b.appendChild(mk("p",rest,"margin:4px 0 0;font-size:14px;line-height:1.55;color:var(--text-secondary)"));
r.appendChild(b);w.appendChild(r)})
}else if(sec===1){
w.appendChild(mk("p","Quando o enunciado trouxer o gatilho da esquerda, a resposta provável é a da direita.","font-size:13px;color:var(--text-secondary);margin:0 0 10px"));
q.d.forEach(r=>{
const c=mk("div","",null,"ct dc");
const l=mk("div","");l.appendChild(mk("p","Se a questão diz",null,"cap"));const lq=mk("p",r[0],"font-weight:500");lq.className="q";l.appendChild(lq);
const a=mk("div","",null,"box ok");a.appendChild(mk("p","Resposta provável",null,"cap"));a.appendChild(mk("p",r[1],"font-weight:500;margin:0"));
c.appendChild(l);c.appendChild(a);w.appendChild(c)})
}else{
w.appendChild(mk("p","Cada linha mostra a alternativa que parece certa, mas está errada, e o que fazer no lugar.","font-size:13px;color:var(--text-secondary);margin:0 0 10px"));
q.t.forEach(r=>{
const c=mk("div","",null,"ct dc");
const x=mk("div","",null,"box no");const xc=mk("p","",null,"cap");xc.appendChild(ic("x"));xc.appendChild(document.createTextNode(" Errado"));xc.style.cssText="display:flex;align-items:center;gap:4px";
x.appendChild(xc);x.appendChild(mk("p",r[0],"margin:0"));
const y=mk("div","",null,"box ok");const yc=mk("p","",null,"cap");yc.appendChild(ic("check"));yc.appendChild(document.createTextNode(" Certo"));yc.style.cssText="display:flex;align-items:center;gap:4px";
y.appendChild(yc);y.appendChild(mk("p",r[1],"margin:0;font-weight:500"));
c.appendChild(x);c.appendChild(y);w.appendChild(c)})
}
const f=mk("p","","font-size:12px;color:var(--text-muted);margin:1rem 0 0");
f.appendChild(document.createTextNode("Resumo reescrito e condensado a partir das folhas de referência de "));
const a=document.createElement("a");a.href="https://claudecertificationguide.com/quick-reference";a.textContent="claudecertificationguide.com";f.appendChild(a);
f.appendChild(document.createTextNode(". Consulte a fonte para a versão completa."));w.appendChild(f);
}
function render(){
$("fc").style.display=tab===1?"block":"none";
$("ck").style.display=tab===2?"block":"none";
$("t1").className="tab"+(tab===1?" on":"");
$("t2").className="tab"+(tab===2?" on":"");
subs();
if(tab===1)show();else cheat();
}
function go(n){ci=(ci+n+order.length)%order.length;back=false;show()}
function fl(){back=!back;show()}
$("t1").onclick=()=>{tab=1;render()};
$("t2").onclick=()=>{tab=2;render()};
$("card").onclick=fl;$("flip").onclick=fl;
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("shuf").onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}ci=0;back=false;show()};
$("card").onkeydown=e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key===" "||e.key==="Enter"){e.preventDefault();fl()}};
reorder();render();
</script></div></body></html>
